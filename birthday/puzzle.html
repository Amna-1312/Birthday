<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Puzzle 🖤</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #050505;
    color: #f5eee8;
    font-family: Georgia, serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    padding: 55px 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.small {
    font-size: 13px;
    letter-spacing: 4px;
    color: #b9a69d;
    margin-bottom: 25px;
}

h1 {
    font-size: 36px;
    font-weight: normal;
    letter-spacing: 3px;
    margin: 0 0 15px;
}

.subtitle {
    color: #b9a69d;
    font-size: 16px;
    line-height: 1.7;
    margin-bottom: 35px;
}

.heart {
    font-size: 35px;
    color: #a51f25;
    margin-bottom: 30px;
}

.question {
    font-size: 18px;
    margin-bottom: 20px;
}

.options {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.option {
    width: 100%;
    padding: 17px;
    border: 1px solid #5b3a3a;
    border-radius: 35px;
    background: #0c0c0c;
    color: #f5eee8;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

.option:hover {
    border-color: #a51f25;
    box-shadow: 0 0 15px rgba(165,31,37,0.3);
}

.message {
    display: none;
    margin-top: 30px;
}

.message p {
    color: #d8c9c1;
    line-height: 1.7;
}

.next {
    display: inline-block;
    margin-top: 15px;
    padding: 14px 35px;
    border: 1px solid #a51f25;
    border-radius: 30px;
    color: #fff;
    text-decoration: none;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="container">

    <div class="small">A LITTLE CHALLENGE</div>

    <div class="heart">♡</div>

    <h1>Before You Continue...</h1>

    <div class="subtitle">
        I have a tiny little puzzle for you.<br>
        Let's see if you can solve it. 🖤
    </div>

    <div class="question">
        What do you think is waiting for you?
    </div>

    <div class="options">

        <button class="option" onclick="wrong()">
            A surprise 🎁
        </button>

        <button class="option" onclick="correct()">
            Something made with love ❤️
        </button>

        <button class="option" onclick="wrong()">
            Nothing 😌
        </button>

    </div>

    <div class="message" id="message">

        <div class="heart">♥</div>

        <h2>You got it! 🥹</h2>

        <p>
            Of course you knew...
            because this little surprise was made
            especially for you. ♡
        </p>

        <a class="next" href="photos.html">
            CONTINUE →
        </a>

    </div>

</div>

<script>

function correct() {
    document.querySelector(".options").style.display = "none";
    document.querySelector(".question").style.display = "none";
    document.getElementById("message").style.display = "block";
}

function wrong() {
    alert("Hmm... try again, my love ♡");
}

</script>

</body>
</html>
