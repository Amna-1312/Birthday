<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday, My Love ♡</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    animation: pageFade 1.2s ease;
}

.page {
    position: relative;
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    background: #000;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* =========================================
   FINAL BIRTHDAY IMAGE
   ========================================= */

.page img {

    width: 100%;
    height: auto;
    display: block;

    opacity: 0;

    transform: scale(0.88);

    animation:
        imageReveal 2s ease 0.8s forwards,
        imageGlow 3s ease-in-out 2.8s infinite alternate;
}


@keyframes pageFade {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


@keyframes imageReveal {

    0% {
        opacity: 0;
        transform: scale(0.88);
        filter: brightness(0.4);
    }

    60% {
        opacity: 1;
        transform: scale(1.03);
        filter: brightness(1.12);
    }

    100% {
        opacity: 1;
        transform: scale(1);
        filter: brightness(1);
    }
}


@keyframes imageGlow {

    from {
        filter: brightness(0.96);
    }

    to {
        filter: brightness(1.08);
    }
}


/* =========================================
   CELEBRATION TEXT
   ========================================= */

.celebration {

    position: absolute;

    top: 25px;

    left: 50%;

    transform: translateX(-50%);

    color: #d8b6b0;

    font-family: Georgia, serif;

    font-size: 13px;

    letter-spacing: 3px;

    white-space: nowrap;

    opacity: 0;

    animation:
        celebrationAppear 1s ease 1.8s forwards;

    z-index: 30;
}


@keyframes celebrationAppear {

    from {
        opacity: 0;
        transform: translate(-50%, -10px);
    }

    to {
        opacity: 1;
        transform: translate(-50%, 0);
    }
}


/* =========================================
   GOLDEN PARTY POPPERS
   ========================================= */

.popper {

    position: absolute;

    top: 13%;

    font-size: 38px;

    opacity: 0;

    z-index: 40;

    animation:
        goldenPop 0.75s cubic-bezier(.17,.67,.35,1.4)
        0.9s forwards;

    filter:
        drop-shadow(0 0 5px #ffd700)
        drop-shadow(0 0 12px rgba(255,215,0,0.8));
}


.popper.left {

    left: 5%;

    transform-origin: bottom right;
}


.popper.right {

    right: 5%;

    transform-origin: bottom left;
}


@keyframes goldenPop {

    0% {

        opacity: 0;

        transform:
            scale(0.1)
            rotate(-35deg);
    }

    35% {

        opacity: 1;

        transform:
            scale(1.35)
            rotate(8deg);
    }

    60% {

        transform:
            scale(0.9)
            rotate(-5deg);
    }

    80% {

        transform:
            scale(1.12)
            rotate(3deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


/* =========================================
   GOLDEN BURST
   ========================================= */

.burst {

    position: absolute;

    top: 16%;

    font-size: 20px;

    color: #ffd700;

    opacity: 0;

    z-index: 35;

    animation:
        burstShow 0.8s ease-out 0.9s forwards;
}


.burst.left {
    left: 13%;
}


.burst.right {
    right: 13%;
}


@keyframes burstShow {

    0% {

        opacity: 0;

        transform: scale(0.2);
    }

    35% {

        opacity: 1;

        transform: scale(1.4);
    }

    100% {

        opacity: 0;

        transform:
            scale(1.8)
            translateY(-12px);
    }
}


/* =========================================
   GOLDEN FALLING CONFETTI
   ========================================= */

.confetti {

    position: absolute;

    top: -20px;

    color: #ffd700;

    font-size: 17px;

    opacity: 0;

    z-index: 35;

    animation:
        goldFall 3.5s ease-out forwards;
}


.c1 {
    left: 10%;
    animation-delay: 0.95s;
}

.c2 {
    left: 20%;
    animation-delay: 1.05s;
}

.c3 {
    left: 31%;
    animation-delay: 0.9s;
}

.c4 {
    left: 43%;
    animation-delay: 1.15s;
}

.c5 {
    left: 55%;
    animation-delay: 0.95s;
}

.c6 {
    left: 67%;
    animation-delay: 1.1s;
}

.c7 {
    left: 79%;
    animation-delay: 0.9s;
}

.c8 {
    left: 90%;
    animation-delay: 1.05s;
}


@keyframes goldFall {

    0% {

        opacity: 0;

        transform:
            translateY(0)
            rotate(0deg);
    }

    15% {

        opacity: 1;
    }

    100% {

        opacity: 0;

        transform:
            translateY(55vh)
            rotate(360deg);
    }
}


/* =========================================
   FLOATING HEARTS
   ========================================= */

.heart {

    position: absolute;

    color: #8b1e27;

    font-size: 20px;

    opacity: 0;

    z-index: 15;

    animation:
        heartFloat 4s ease-in-out infinite;
}


.h1 {

    left: 10%;

    bottom: 22%;

    animation-delay: 2s;
}


.h2 {

    right: 10%;

    bottom: 30%;

    animation-delay: 2.7s;
}


.h3 {

    left: 16%;

    top: 45%;

    animation-delay: 3.2s;
}


.h4 {

    right: 15%;

    top: 50%;

    animation-delay: 3.8s;
}


@keyframes heartFloat {

    0% {

        opacity: 0;

        transform:
            translateY(15px)
            scale(0.8);
    }

    30% {

        opacity: 0.7;
    }

    70% {

        opacity: 0.5;
    }

    100% {

        opacity: 0;

        transform:
            translateY(-35px)
            scale(1.15);
    }
}


/* =========================================
   MUSIC BUTTON
   ========================================= */

.music-button {

    position: absolute;

    bottom: 25px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 50;

    padding: 10px 22px;

    border: 1px solid #7d1820;

    border-radius: 30px;

    background: rgba(0,0,0,0.8);

    color: #e8d7d2;

    font-family: Georgia, serif;

    font-size: 13px;

    letter-spacing: 1px;

    cursor: pointer;

    opacity: 0;

    animation:
        musicAppear 1s ease 3s forwards;

    transition: 0.3s ease;
}


.music-button:hover {

    background: #7d1820;

    box-shadow:
        0 0 18px rgba(125,24,32,0.6);
}


@keyframes musicAppear {

    from {
        opacity: 0;
        transform:
            translateX(-50%)
            translateY(10px);
    }

    to {
        opacity: 1;
        transform:
            translateX(-50%)
            translateY(0);
    }
}

</style>

</head>


<body>


<!-- Background music -->

<audio id="birthdayMusic" loop>

    <source
        src="music/perfect.mp3"
        type="audio/mpeg"
    >

</audio>


<div class="page">


    <!-- Celebration text -->

    <div class="celebration">
        A LITTLE CELEBRATION ♡
    </div>


    <!-- Golden party poppers -->

    <div class="popper left">
        🎉
    </div>

    <div class="popper right">
        🎉
    </div>


    <!-- Golden burst -->

    <div class="burst left">
        ✦ ✧
    </div>

    <div class="burst right">
        ✧ ✦
    </div>


    <!-- Golden confetti -->

    <div class="confetti c1">✦</div>
    <div class="confetti c2">•</div>
    <div class="confetti c3">✦</div>
    <div class="confetti c4">•</div>
    <div class="confetti c5">✦</div>
    <div class="confetti c6">•</div>
    <div class="confetti c7">✦</div>
    <div class="confetti c8">•</div>


    <!-- Floating hearts -->

    <div class="heart h1">♡</div>

    <div class="heart h2">♥</div>

    <div class="heart h3">♡</div>

    <div class="heart h4">♥</div>


    <!-- Final birthday image -->

    <img
        src="final.png"
        alt="Happy Birthday My Love"
    >


    <!-- Music button -->

    <button
        class="music-button"
        onclick="toggleMusic()"
        id="musicButton"
    >
        ♫ Our Song
    </button>


</div>


<script>


/* =========================================
   MUSIC
   ========================================= */

const music =
    document.getElementById("birthdayMusic");

const musicButton =
    document.getElementById("musicButton");


/* Try to start music automatically */

window.addEventListener("load", function() {

    setTimeout(function() {

        music.play().then(function() {

            musicButton.innerHTML =
                "♫ Our Song — Playing";

        }).catch(function() {

            musicButton.innerHTML =
                "♫ Play Our Song";

        });

    }, 1200);

});


/* Music button */

function toggleMusic() {

    if (music.paused) {

        music.play();

        musicButton.innerHTML =
            "♫ Our Song — Playing";

    }

    else {

        music.pause();

        musicButton.innerHTML =
            "♫ Play Our Song";
    }

}

</script>


</body>

</html>
