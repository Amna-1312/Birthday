<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories 🖤</title>

<style>
body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Georgia, serif;
    text-align: center;
}

.photo {
    display: none;
    width: 100%;
    height: 100vh;
    object-fit: contain;
}

button {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: #111;
    color: #fff;
    border: 1px solid #8b0000;
    border-radius: 30px;
    padding: 14px 35px;
    font-size: 16px;
}
</style>
</head>

<body>

<img class="photo" src="photos/photo1.jpeg">
<img class="photo" src="photos/photo2.jpeg">
<img class="photo" src="photos/photo3.JPG">

<button onclick="nextPhoto()">NEXT ♡</button>

<script>
let current = 0;
let photos = document.querySelectorAll(".photo");

photos[current].style.display = "block";

function nextPhoto() {
    photos[current].style.display = "none";
    current++;

    if (current < photos.length) {
        photos[current].style.display = "block";
    } else {
        current = 0;
        photos[current].style.display = "block";
    }
}
</script>

</body>
</html>
