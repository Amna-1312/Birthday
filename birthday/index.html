<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Love ♡</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            position: relative;
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: hidden;
        }

        .page img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Invisible button over the button in the image */

        .next-button {
            position: absolute;

            /* button ki position */
            left: 10%;
            right: 10%;
            bottom: 14%;

            height: 8%;
            border-radius: 50px;

            cursor: pointer;
            text-decoration: none;

            background: transparent;
        }

    </style>
</head>

<body>

    <div class="page">

        <img src="1(1).png" alt="For My Love">

        <!-- First slide button -->
        <a href="#" class="next-button"></a>

    </div>

</body>
</html>
